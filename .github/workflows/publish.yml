name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify tag
        run: node -e 'if ("v" + require("./package.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
      - name: Publish the verified package using OIDC
        run: node scripts/publish.mjs
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.tgz --generate-notes
