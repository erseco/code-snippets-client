name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: coverage
          path: coverage/
  wordpress:
    name: WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / Snippets ${{ matrix.snippets }}
    strategy:
      fail-fast: false
      matrix:
        wordpress: ["6.9.7", "7.0.4", "7.1"]
        php: ["8.3", "8.4"]
        snippets: ["3.9.6", "3.10.2"]
        include:
          - { wordpress: "6.9.5", php: "8.3", snippets: "3.9.6" }
          - { wordpress: "6.9.5", php: "8.4", snippets: "3.9.6" }
    env:
      WP_ENV_CORE: https://wordpress.org/wordpress-${{ matrix.wordpress }}.zip
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
      TEST_CODE_SNIPPETS_VERSION: ${{ matrix.snippets }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
      - run: npm run wp:stop
        if: always()
